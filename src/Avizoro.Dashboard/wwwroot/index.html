<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avizoro Dashboard</title>
    <base href="/" />
    <script>
        // Apply the saved theme before first paint so there's no flash.
        (function () {
            try {
                var t = localStorage.getItem('avizoro_theme') || 'dark';
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) { /* storage unavailable — stay on the default */ }
        })();
        window.ikSetTheme = function (t) {
            try { localStorage.setItem('avizoro_theme', t); } catch (e) { }
            document.documentElement.setAttribute('data-bs-theme', t);
        };
        window.ikGetTheme = function () {
            return document.documentElement.getAttribute('data-bs-theme') || 'dark';
        };
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Avizoro.Dashboard.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
