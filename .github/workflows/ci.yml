name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test (non-MAUI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The SDK packages and their tests target net8.0, net9.0 and net10.0: the
      # .NET 10 SDK builds all three, the older runtimes are needed to run the tests.
      - name: Setup .NET 8, 9 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # The MAUI projects (Avizoro.Maui, Sample.Maui) need platform
      # workloads/SDKs and are intentionally excluded here — CI validates the
      # framework-agnostic core, the backend, the dashboard and the test suite.
      # Building the Server transitively builds Core, Server.Contracts,
      # Server.Data and all three Server.Migrations.* provider assemblies.
      - name: Restore
        run: |
          dotnet restore src/Avizoro.Server/Avizoro.Server.csproj
          dotnet restore src/Avizoro.Dashboard/Avizoro.Dashboard.csproj
          dotnet restore tests/Avizoro.Core.Tests/Avizoro.Core.Tests.csproj
          dotnet restore tests/Avizoro.Server.Tests/Avizoro.Server.Tests.csproj
          dotnet restore tests/Avizoro.Sdk.Tests/Avizoro.Sdk.Tests.csproj

      - name: Build server
        run: dotnet build src/Avizoro.Server/Avizoro.Server.csproj --configuration Release --no-restore

      - name: Build dashboard
        run: dotnet build src/Avizoro.Dashboard/Avizoro.Dashboard.csproj --configuration Release --no-restore

      - name: Test (Core)
        run: >
          dotnet test tests/Avizoro.Core.Tests/Avizoro.Core.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=core-test-results.trx"
          --results-directory ./TestResults

      - name: Test (Server integration)
        run: >
          dotnet test tests/Avizoro.Server.Tests/Avizoro.Server.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=server-test-results.trx"
          --results-directory ./TestResults

      - name: "Test (SDKs: hosting, ASP.NET Core)"
        run: >
          dotnet test tests/Avizoro.Sdk.Tests/Avizoro.Sdk.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=sdk-test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore
